name: Claude リリースノート チェック

on:
  schedule:
    # 毎日 00:00 UTC → JST 09:00 に実行
    - cron: '0 0 * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  check:
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Node.js をセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 依存関係をインストール
        run: npm ci

      - name: Claude リリースノートをチェック・Slack通知
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node check_claude_news.js

      - name: last_checked.json と raw/ の変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_checked.json my_claude_new_wiki/raw/
          if git diff --cached --quiet; then
            echo "last_checked.json・raw/ に変更なし。コミットをスキップします。"
          else
            git commit -m "chore: last_checked.json・raw/ を更新"
            git push
          fi
